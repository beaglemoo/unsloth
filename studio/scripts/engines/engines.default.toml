# Unsloth attached engines (oMLX and ComfyUI).
#
# Read by the omlx-launch and comfyui-launch wrappers and by the Studio
# desktop tray. Written by studio/scripts/build-engines-mac.sh only when it is
# missing, so edit freely. build-engines-mac.sh and update-engines-mac.sh remove
# the retired OMLX_PEER_EVICT_URLS setting and the retired debug switches (OMLX_NAX,
# OMLX_QWEN35_SPARSE_BOUNDARIES, OMLX_QWEN35_QMM_NAX_VARIANT, only when they still have
# the old generated values) from old generated files, replace the old default ComfyUI
# extra_args with the one that has --cache-none and add the missing MPS watermark keys (backup:
# engines.toml.bak-<timestamp>; a customized extra_args is never touched). "~" is expanded in every path.
#
# Per-run overrides (used for testing on alternate ports):
#   UNSLOTH_ENGINES_CONFIG=<other toml>  UNSLOTH_ENGINES_HOME=<dir>

[omlx]
base_path = "~/.omlx-tuned"
port = 8843
# Memory ceiling: memory.memory_guard_tier in <base_path>/settings.json must be "safe"
# (51.2 GiB on a 64 GB Mac, under the 56 GB Metal wired limit). Never "custom": it
# disables conservative memory management.
# host = "127.0.0.1"   # unset: oMLX uses the host from <base_path>/settings.json
# extra_args = []

[omlx.env]
MallocSpaceEfficient = "1"
OMLX_SUPERVISED = "launchd"

# ComfyUI (bundled helper ai.unsloth.studio.comfyui). Loopback only: ComfyUI has no auth.
[comfyui]
port = 8844
data_dir = "~/.unsloth/engines/comfyui-data"
# Read-only shared weights, written into extra_model_paths.unsloth.yaml at every start.
model_dirs = ["~/Library/Application Support/StoryPressRuntime/ComfyUI/models"]
# The StoryPress-tested Apple Silicon flags plus no custom nodes and no internet for the web UI.
# --cache-none drops cached node outputs after each job so image-edit jobs do not keep growing.
extra_args = ["--lowvram", "--disable-smart-memory", "--cpu-vae", "--disable-all-custom-nodes", "--offline", "--cache-none"]

[comfyui.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"
# Qwen-Image 2.1 edit jobs grew ComfyUI to 74-84 GB because freed MPS attention buffers are only reclaimed
# at PyTorch's default low watermark (78 GiB). Reclaim at 0.5 x the Metal limit and fail the job cleanly
# at 0.8 instead of letting macOS swap or kill the process. See comfyui-edit-memory-diag.md.
PYTORCH_MPS_LOW_WATERMARK_RATIO = "0.5"
PYTORCH_MPS_HIGH_WATERMARK_RATIO = "0.8"
