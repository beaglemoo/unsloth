# Pinned third-party sources for the beaglemoo fork. Read by studio/install_python_stack.py when
# the fork installs itself (`STUDIO_LOCAL_NONEDITABLE=1`, which build-fork-mac.sh and the app's
# repair set). The fork never installs unsloth-zoo from upstream's moving `main`: it installs
# exactly the commit below, and fails closed when this file is missing or malformed.
#
# Flat format on purpose ([section] and key = "string" only): install_python_stack.py parses it
# without tomllib (it supports Python 3.9).
#
# Bump deliberately (see /Users/beaglemoo/Homelab/unsloth/CLAUDE.md, "unsloth-zoo pin"):
#   1. pick the unsloth-zoo commit, read its version from unsloth_zoo/__init__.py at that commit
#   2. edit `commit` and `version` here, in one commit
#   3. run `studio/scripts/update-fork.sh` (or build-fork-mac.sh --install) and check
#      `~/.unsloth/studio/unsloth_studio/bin/python -c "import importlib.metadata as m; print(m.version('unsloth_zoo'))"`
# Recorded 2026-10-04 from the live ~/.unsloth/studio venv (direct_url.json commit_id); bumped 2026-10-17 to
# the zoo main commit that pins mlx==0.32.4 (the PyPI 2026.10.6 build pins 0.32.3, Studio needs 0.32.4).
# Bumped 2026-10-27 to zoo main aeb831ae (2026.10.9, mlx==0.32.4, mlx-lm <=0.32.2, mlx-vlm <=0.7.9): upstream
# Studio imports unsloth_zoo.mlx.loader._ensure_deepseek_v41_omlx_layout, which the 2026.10.9 release commit
# d139fd20 lacks; same version string, so the installer also checks the recorded commit_id.

[unsloth-zoo]
version = "2026.10.9"
url = "https://github.com/unslothai/unsloth-zoo"
commit = "aeb831ae1da152bfee9bd580df2e70c858fe2a71"
